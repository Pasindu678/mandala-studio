[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  JWT_SECRET = "mandala_studio_super_secret_jwt_key_2026_xyz"
  NEXT_PUBLIC_PAYMENT_MODE = "mock"
  DATABASE_URL = "file:./prisma/dev.db"

[functions]
  included_files = ["prisma/**", "storage/**", "public/uploads/**"]

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
